<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="597" viewBox="0 0 1600 597">
  <rect width="100%" height="100%" fill="#f4f7fb"/>
  <text x="28" y="48" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#14243a">Q2.1 — Requirement Model</text><rect x="0" y="76" width="1600" height="59" fill="#17365d"/><text x="18" y="111" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Element</text><text x="348" y="111" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Model</text><line x1="330" y1="76" x2="330" y2="135" stroke="#7890ad" stroke-width="1"/><rect x="0" y="135" width="1600" height="64" fill="#ffffff"/><text x="18" y="170" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">Input</text><line x1="330" y1="135" x2="330" y2="199" stroke="#c7d2df" stroke-width="1"/><text x="348" y="170" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Android, iOS and Windows architecture: kernel, system interfaces, runtime, framework, process model, isolation, IPC and push services.</text><line x1="0" y1="199" x2="1600" y2="199" stroke="#c7d2df" stroke-width="1"/><rect x="0" y="199" width="1600" height="64" fill="#eaf0f7"/><text x="18" y="234" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">Output</text><line x1="330" y1="199" x2="330" y2="263" stroke="#c7d2df" stroke-width="1"/><text x="348" y="234" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">A comparison matrix, message-delivery traces and a platform-specific background messaging design decision.</text><line x1="0" y1="263" x2="1600" y2="263" stroke="#c7d2df" stroke-width="1"/><rect x="0" y="263" width="1600" height="64" fill="#ffffff"/><text x="18" y="298" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">Objective</text><line x1="330" y1="263" x2="330" y2="327" stroke="#c7d2df" stroke-width="1"/><text x="348" y="298" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Determine how each architecture affects reliable, secure and battery-efficient message delivery when the app is not foregrounded.</text><line x1="0" y1="327" x2="1600" y2="327" stroke="#c7d2df" stroke-width="1"/><rect x="0" y="327" width="1600" height="82" fill="#eaf0f7"/><text x="18" y="362" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">Constraints</text><line x1="330" y1="327" x2="330" y2="409" stroke="#c7d2df" stroke-width="1"/><text x="348" y="362" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Screen off; app may be suspended or terminated; background execution limits; confidentiality and isolation; low battery use; low</text><text x="348" y="385" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">notification latency.</text><line x1="0" y1="409" x2="1600" y2="409" stroke="#c7d2df" stroke-width="1"/><rect x="0" y="409" width="1600" height="82" fill="#ffffff"/><text x="18" y="444" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">Decision</text><line x1="330" y1="409" x2="330" y2="491" stroke="#c7d2df" stroke-width="1"/><text x="348" y="444" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Choose the push and background-processing mechanism for each OS and decide which parts of the client can be shared versus</text><text x="348" y="467" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">platform-specific.</text><line x1="0" y1="491" x2="1600" y2="491" stroke="#c7d2df" stroke-width="1"/><rect x="0" y="491" width="1600" height="82" fill="#eaf0f7"/><text x="18" y="526" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">Required information</text><line x1="330" y1="491" x2="330" y2="573" stroke="#c7d2df" stroke-width="1"/><text x="348" y="526" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Kernel family and system-call boundary; driver/network path; push infrastructure; runtime and callback model; lifecycle/termination</text><text x="348" y="549" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">policy; sandbox and permissions; IPC; background quotas and power management.</text><line x1="0" y1="573" x2="1600" y2="573" stroke="#c7d2df" stroke-width="1"/><text x="28" y="587" font-family="Arial, sans-serif" font-size="12" fill="#62748a">Assignment 4 • Q2.1 — Requirement Model</text></svg>