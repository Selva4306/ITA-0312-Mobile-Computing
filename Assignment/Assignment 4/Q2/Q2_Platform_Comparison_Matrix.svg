<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160">
  <rect width="100%" height="100%" fill="#f4f7fb"/>
  <text x="28" y="48" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#14243a">Q2.3 — Android vs iOS vs Windows</text><rect x="0" y="76" width="1600" height="59" fill="#17365d"/><text x="18" y="111" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Area</text><text x="278" y="111" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Android</text><line x1="260" y1="76" x2="260" y2="135" stroke="#7890ad" stroke-width="1"/><text x="718" y="111" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">iOS</text><line x1="700" y1="76" x2="700" y2="135" stroke="#7890ad" stroke-width="1"/><text x="1158" y="111" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Windows</text><line x1="1140" y1="76" x2="1140" y2="135" stroke="#7890ad" stroke-width="1"/><rect x="0" y="135" width="1600" height="105" fill="#ffffff"/><text x="18" y="170" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">Kernel family /</text><text x="18" y="193" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">structure</text><line x1="260" y1="135" x2="260" y2="240" stroke="#c7d2df" stroke-width="1"/><text x="278" y="170" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Linux monolithic kernel with loadable</text><text x="278" y="193" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">modules, drivers and Android changes; most</text><text x="278" y="216" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">framework services run in user space.</text><line x1="700" y1="135" x2="700" y2="240" stroke="#c7d2df" stroke-width="1"/><text x="718" y="170" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Darwin XNU hybrid kernel combining Mach</text><text x="718" y="193" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">facilities, BSD components and I/O Kit</text><text x="718" y="216" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">driver infrastructure.</text><line x1="1140" y1="135" x2="1140" y2="240" stroke="#c7d2df" stroke-width="1"/><text x="1158" y="170" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Windows NT hybrid design with kernel-mode</text><text x="1158" y="193" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">components, executive services and user-mode</text><text x="1158" y="216" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">subsystems.</text><line x1="0" y1="240" x2="1600" y2="240" stroke="#c7d2df" stroke-width="1"/><rect x="0" y="240" width="1600" height="128" fill="#eaf0f7"/><text x="18" y="275" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">Kernel-level programming</text><text x="18" y="298" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">interface</text><line x1="260" y1="240" x2="260" y2="368" stroke="#c7d2df" stroke-width="1"/><text x="278" y="275" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Linux system calls and device interfaces;</text><text x="278" y="298" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Binder driver supports Android IPC. Apps</text><text x="278" y="321" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">normally call framework APIs, not arbitrary</text><text x="278" y="344" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">syscalls.</text><line x1="700" y1="240" x2="700" y2="368" stroke="#c7d2df" stroke-width="1"/><text x="718" y="275" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Mach traps and Mach IPC plus BSD/POSIX</text><text x="718" y="298" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">system calls; I/O Kit supports drivers.</text><text x="718" y="321" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Apps use public frameworks, not private</text><text x="718" y="344" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">kernel interfaces.</text><line x1="1140" y1="240" x2="1140" y2="368" stroke="#c7d2df" stroke-width="1"/><text x="1158" y="275" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">NT system-service boundary; Win32 is the</text><text x="1158" y="298" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">supported app interface. Device access</text><text x="1158" y="321" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">commonly uses I/O control requests (IOCTLs).</text><line x1="0" y1="368" x2="1600" y2="368" stroke="#c7d2df" stroke-width="1"/><rect x="0" y="368" width="1600" height="151" fill="#ffffff"/><text x="18" y="403" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">Runtime</text><line x1="260" y1="368" x2="260" y2="519" stroke="#c7d2df" stroke-width="1"/><text x="278" y="403" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Dalvik (historical) is a register-based VM</text><text x="278" y="426" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">executing DEX bytecode with interpretation</text><text x="278" y="449" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">and JIT. Android 5.0+ uses ART with JIT and</text><text x="278" y="472" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">AOT.</text><line x1="700" y1="368" x2="700" y2="519" stroke="#c7d2df" stroke-width="1"/><text x="718" y="403" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Objective-C runtime is a native language</text><text x="718" y="426" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">runtime, not a bytecode VM. App code is</text><text x="718" y="449" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">native ARM64; runtime supports class</text><text x="718" y="472" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">metadata and dynamic dispatch such as</text><text x="718" y="495" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">objc_msgSend.</text><line x1="1140" y1="368" x2="1140" y2="519" stroke="#c7d2df" stroke-width="1"/><text x="1158" y="403" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">WinRT is an API/metadata and</text><text x="1158" y="426" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">language-projection system, not one universal</text><text x="1158" y="449" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">VM. C# uses .NET; C++/WinRT is compiled to</text><text x="1158" y="472" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">native code.</text><line x1="0" y1="519" x2="1600" y2="519" stroke="#c7d2df" stroke-width="1"/><rect x="0" y="519" width="1600" height="128" fill="#eaf0f7"/><text x="18" y="554" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">Application framework</text><line x1="260" y1="519" x2="260" y2="647" stroke="#c7d2df" stroke-width="1"/><text x="278" y="554" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Android SDK/framework: Activity and Service</text><text x="278" y="577" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">lifecycle, notifications, permissions,</text><text x="278" y="600" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">JobScheduler/WorkManager and FCM</text><text x="278" y="623" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">integration.</text><line x1="700" y1="519" x2="700" y2="647" stroke="#c7d2df" stroke-width="1"/><text x="718" y="554" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">UIKit/SwiftUI, UserNotifications and</text><text x="718" y="577" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">BackgroundTasks; APNs and iOS lifecycle</text><text x="718" y="600" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">services manage remote notifications and</text><text x="718" y="623" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">app activation.</text><line x1="1140" y1="519" x2="1140" y2="647" stroke="#c7d2df" stroke-width="1"/><text x="1158" y="554" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">UWP/WinUI or Windows App SDK, WNS and</text><text x="1158" y="577" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">background-task/lifecycle APIs. Exact</text><text x="1158" y="600" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">facilities vary by UWP versus packaged</text><text x="1158" y="623" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">WinUI/desktop app.</text><line x1="0" y1="647" x2="1600" y2="647" stroke="#c7d2df" stroke-width="1"/><rect x="0" y="647" width="1600" height="105" fill="#ffffff"/><text x="18" y="682" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">Isolation</text><line x1="260" y1="647" x2="260" y2="752" stroke="#c7d2df" stroke-width="1"/><text x="278" y="682" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Per-app Linux UID and process sandbox;</text><text x="278" y="705" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">SELinux mandatory access control;</text><text x="278" y="728" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">permissions gate protected APIs.</text><line x1="700" y1="647" x2="700" y2="752" stroke="#c7d2df" stroke-width="1"/><text x="718" y="682" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Code signing, per-app container and</text><text x="718" y="705" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">entitlements; privacy permissions restrict</text><text x="718" y="728" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">sensitive APIs.</text><line x1="1140" y1="647" x2="1140" y2="752" stroke="#c7d2df" stroke-width="1"/><text x="1158" y="682" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">AppContainer/package identity and declared</text><text x="1158" y="705" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">capabilities restrict packaged apps; brokered</text><text x="1158" y="728" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">APIs mediate access.</text><line x1="0" y1="752" x2="1600" y2="752" stroke="#c7d2df" stroke-width="1"/><rect x="0" y="752" width="1600" height="128" fill="#eaf0f7"/><text x="18" y="787" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">IPC</text><line x1="260" y1="752" x2="260" y2="880" stroke="#c7d2df" stroke-width="1"/><text x="278" y="787" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Binder driver/framework for system</text><text x="278" y="810" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">services; intents, bound services,</text><text x="278" y="833" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">broadcasts and content providers at higher</text><text x="278" y="856" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">level.</text><line x1="700" y1="752" x2="700" y2="880" stroke="#c7d2df" stroke-width="1"/><text x="718" y="787" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Mach ports/messages underneath; XPC and</text><text x="718" y="810" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">system frameworks provide higher-level IPC.</text><line x1="1140" y1="752" x2="1140" y2="880" stroke="#c7d2df" stroke-width="1"/><text x="1158" y="787" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">ALPC is used internally; apps commonly use</text><text x="1158" y="810" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">COM/RPC, WinRT activation, named pipes and app</text><text x="1158" y="833" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">services.</text><line x1="0" y1="880" x2="1600" y2="880" stroke="#c7d2df" stroke-width="1"/><rect x="0" y="880" width="1600" height="128" fill="#ffffff"/><text x="18" y="915" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">Background push</text><line x1="260" y1="880" x2="260" y2="1008" stroke="#c7d2df" stroke-width="1"/><text x="278" y="915" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">FCM, commonly through Google Play services.</text><text x="278" y="938" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">High-priority pushes can grant temporary</text><text x="278" y="961" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">background execution, subject to Doze and</text><text x="278" y="984" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">policy limits.</text><line x1="700" y1="880" x2="700" y2="1008" stroke="#c7d2df" stroke-width="1"/><text x="718" y="915" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">APNs via system push infrastructure.</text><text x="718" y="938" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Eligible background pushes may wake/launch</text><text x="718" y="961" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">an app briefly; delivery is discretionary</text><text x="718" y="984" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">and can be throttled.</text><line x1="1140" y1="880" x2="1140" y2="1008" stroke="#c7d2df" stroke-width="1"/><text x="1158" y="915" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">WNS. Raw push can trigger registered</text><text x="1158" y="938" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">background work or wake a supported app model,</text><text x="1158" y="961" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">subject to capability and lifecycle rules.</text><line x1="0" y1="1008" x2="1600" y2="1008" stroke="#c7d2df" stroke-width="1"/><rect x="0" y="1008" width="1600" height="128" fill="#eaf0f7"/><text x="18" y="1043" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">Consequence for</text><text x="18" y="1066" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">messaging</text><line x1="260" y1="1008" x2="260" y2="1136" stroke="#c7d2df" stroke-width="1"/><text x="278" y="1043" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Use FCM, persist messages server-side,</text><text x="278" y="1066" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">process quickly in the callback/service and</text><text x="278" y="1089" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">notify. Do not rely on an unrestricted</text><text x="278" y="1112" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">background service/socket.</text><line x1="700" y1="1008" x2="700" y2="1136" stroke="#c7d2df" stroke-width="1"/><text x="718" y="1043" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Use APNs alert pushes for user-visible</text><text x="718" y="1066" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">urgency; silent pushes are best-effort</text><text x="718" y="1089" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">refresh, not guaranteed immediate</text><text x="718" y="1112" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">execution.</text><line x1="1140" y1="1008" x2="1140" y2="1136" stroke="#c7d2df" stroke-width="1"/><text x="1158" y="1043" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Use WNS and raw-push/background-task</text><text x="1158" y="1066" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">activation where supported; keep tasks short</text><text x="1158" y="1089" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">and account for app-model differences.</text><line x1="0" y1="1136" x2="1600" y2="1136" stroke="#c7d2df" stroke-width="1"/><text x="28" y="1150" font-family="Arial, sans-serif" font-size="12" fill="#62748a">Assignment 4 • Q2.3 — Android vs iOS vs Windows</text></svg>