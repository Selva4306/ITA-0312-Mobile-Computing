<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="574" viewBox="0 0 1600 574">
  <rect width="100%" height="100%" fill="#f4f7fb"/>
  <text x="28" y="48" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#14243a">Q2.5 — Process Termination Trace</text><rect x="0" y="76" width="1600" height="59" fill="#17365d"/><text x="18" y="111" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Step</text><text x="278" y="111" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Android</text><line x1="260" y1="76" x2="260" y2="135" stroke="#7890ad" stroke-width="1"/><text x="948" y="111" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">iOS</text><line x1="930" y1="76" x2="930" y2="135" stroke="#7890ad" stroke-width="1"/><rect x="0" y="135" width="1600" height="64" fill="#ffffff"/><text x="18" y="170" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">Push arrives</text><line x1="260" y1="135" x2="260" y2="199" stroke="#c7d2df" stroke-width="1"/><text x="278" y="170" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">FCM receives the push through Google Play services.</text><line x1="930" y1="135" x2="930" y2="199" stroke="#c7d2df" stroke-width="1"/><text x="948" y="170" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">APNs push reaches system push service.</text><line x1="0" y1="199" x2="1600" y2="199" stroke="#c7d2df" stroke-width="1"/><rect x="0" y="199" width="1600" height="82" fill="#eaf0f7"/><text x="18" y="234" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">Process check</text><line x1="260" y1="199" x2="260" y2="281" stroke="#c7d2df" stroke-width="1"/><text x="278" y="234" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Android sees no process and evaluates message priority and</text><text x="278" y="257" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">background restrictions.</text><line x1="930" y1="199" x2="930" y2="281" stroke="#c7d2df" stroke-width="1"/><text x="948" y="234" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">iOS evaluates push type, capability, app state and delivery policy.</text><line x1="0" y1="281" x2="1600" y2="281" stroke="#c7d2df" stroke-width="1"/><rect x="0" y="281" width="1600" height="82" fill="#ffffff"/><text x="18" y="316" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">Activation</text><line x1="260" y1="281" x2="260" y2="363" stroke="#c7d2df" stroke-width="1"/><text x="278" y="316" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">An eligible high-priority FCM can cause process/service startup and</text><text x="278" y="339" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">callback.</text><line x1="930" y1="281" x2="930" y2="363" stroke="#c7d2df" stroke-width="1"/><text x="948" y="316" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">An eligible background push can launch the app directly into</text><text x="948" y="339" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">background and deliver the callback.</text><line x1="0" y1="363" x2="1600" y2="363" stroke="#c7d2df" stroke-width="1"/><rect x="0" y="363" width="1600" height="82" fill="#eaf0f7"/><text x="18" y="398" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">Work</text><line x1="260" y1="363" x2="260" y2="445" stroke="#c7d2df" stroke-width="1"/><text x="278" y="398" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">App performs short work, stores the message and posts a</text><text x="278" y="421" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">notification.</text><line x1="930" y1="363" x2="930" y2="445" stroke="#c7d2df" stroke-width="1"/><text x="948" y="398" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">App gets limited time, processes the event and calls completion</text><text x="948" y="421" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">handler.</text><line x1="0" y1="445" x2="1600" y2="445" stroke="#c7d2df" stroke-width="1"/><rect x="0" y="445" width="1600" height="105" fill="#ffffff"/><text x="18" y="480" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">Restriction</text><line x1="260" y1="445" x2="260" y2="550" stroke="#c7d2df" stroke-width="1"/><text x="278" y="480" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Normal-priority pushes may be delayed by Doze. A force-stopped app</text><text x="278" y="503" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">is a different state and generally needs user action.</text><line x1="930" y1="445" x2="930" y2="550" stroke="#c7d2df" stroke-width="1"/><text x="948" y="480" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">A user-force-quit app is not automatically launched for remote</text><text x="948" y="503" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">notifications until relaunched; silent pushes may be</text><text x="948" y="526" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">throttled/discarded.</text><line x1="0" y1="550" x2="1600" y2="550" stroke="#c7d2df" stroke-width="1"/><text x="28" y="564" font-family="Arial, sans-serif" font-size="12" fill="#62748a">Assignment 4 • Q2.5 — Process Termination Trace</text></svg>