<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="497" viewBox="0 0 1600 497">
  <rect width="100%" height="100%" fill="#f4f7fb"/>
  <text x="28" y="48" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#14243a">Q3.3 — Startup, Memory and Portability</text><rect x="0" y="76" width="1600" height="59" fill="#17365d"/><text x="18" y="111" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Design</text><text x="288" y="111" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Startup</text><line x1="270" y1="76" x2="270" y2="135" stroke="#7890ad" stroke-width="1"/><text x="728" y="111" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Memory footprint</text><line x1="710" y1="76" x2="710" y2="135" stroke="#7890ad" stroke-width="1"/><text x="1168" y="111" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Portability</text><line x1="1150" y1="76" x2="1150" y2="135" stroke="#7890ad" stroke-width="1"/><rect x="0" y="135" width="1600" height="105" fill="#ffffff"/><text x="18" y="170" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">Dalvik VM</text><line x1="270" y1="135" x2="270" y2="240" stroke="#c7d2df" stroke-width="1"/><text x="288" y="170" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">VM startup, class loading and JIT warm-up</text><text x="288" y="193" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">can add latency.</text><line x1="710" y1="135" x2="710" y2="240" stroke="#c7d2df" stroke-width="1"/><text x="728" y="170" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">VM structures and JIT cache add overhead;</text><text x="728" y="193" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">DEX is compact but runtime memory is</text><text x="728" y="216" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">additional.</text><line x1="1150" y1="135" x2="1150" y2="240" stroke="#c7d2df" stroke-width="1"/><text x="1168" y="170" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">DEX is Android bytecode and can run on</text><text x="1168" y="193" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">compatible Android CPUs without per-CPU app</text><text x="1168" y="216" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">compilation.</text><line x1="0" y1="240" x2="1600" y2="240" stroke="#c7d2df" stroke-width="1"/><rect x="0" y="240" width="1600" height="105" fill="#eaf0f7"/><text x="18" y="275" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">Objective-C native</text><line x1="270" y1="240" x2="270" y2="345" stroke="#c7d2df" stroke-width="1"/><text x="288" y="275" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Avoids bytecode/JIT warm-up, but dyld</text><text x="288" y="298" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">linking, framework loading and runtime</text><text x="288" y="321" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">initialization remain.</text><line x1="710" y1="240" x2="710" y2="345" stroke="#c7d2df" stroke-width="1"/><text x="728" y="275" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">No general managed VM/GC heap; native</text><text x="728" y="298" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">pages, frameworks, metadata and app objects</text><text x="728" y="321" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">still use RAM.</text><line x1="1150" y1="240" x2="1150" y2="345" stroke="#c7d2df" stroke-width="1"/><text x="1168" y="275" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Binaries target Apple architectures/OS; less</text><text x="1168" y="298" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">portable to unrelated OS platforms.</text><line x1="0" y1="345" x2="1600" y2="345" stroke="#c7d2df" stroke-width="1"/><rect x="0" y="345" width="1600" height="128" fill="#ffffff"/><text x="18" y="380" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">Windows / WinRT</text><line x1="270" y1="345" x2="270" y2="473" stroke="#c7d2df" stroke-width="1"/><text x="288" y="380" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Native C++ avoids managed JIT; managed .NET</text><text x="288" y="403" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">may initialize/JIT unless AOT/native images</text><text x="288" y="426" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">are used.</text><line x1="710" y1="345" x2="710" y2="473" stroke="#c7d2df" stroke-width="1"/><text x="728" y="380" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Native apps can avoid managed runtime</text><text x="728" y="403" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">overhead; managed apps need runtime/GC</text><text x="728" y="426" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">structures. Framework size also matters.</text><line x1="1150" y1="345" x2="1150" y2="473" stroke="#c7d2df" stroke-width="1"/><text x="1168" y="380" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">WinRT projections permit multiple languages</text><text x="1168" y="403" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">to call common APIs, but compatibility</text><text x="1168" y="426" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">depends on Windows version, architecture,</text><text x="1168" y="449" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">language and package model.</text><line x1="0" y1="473" x2="1600" y2="473" stroke="#c7d2df" stroke-width="1"/><text x="28" y="487" font-family="Arial, sans-serif" font-size="12" fill="#62748a">Assignment 4 • Q3.3 — Startup, Memory and Portability</text></svg>