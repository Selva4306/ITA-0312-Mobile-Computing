<svg xmlns="http://www.w3.org/2000/svg" width="1630" height="579" viewBox="0 0 1630 579">
  <rect width="100%" height="100%" fill="#f4f7fb"/>
  <text x="28" y="48" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#14243a">Q3.4 — Cold Start vs Warm Start</text><rect x="0" y="76" width="1630" height="59" fill="#17365d"/><text x="18" y="111" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Launch stage</text><text x="348" y="111" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Cold start: process absent</text><line x1="330" y1="76" x2="330" y2="135" stroke="#7890ad" stroke-width="1"/><text x="998" y="111" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Warm start: process suspended</text><line x1="980" y1="76" x2="980" y2="135" stroke="#7890ad" stroke-width="1"/><rect x="0" y="135" width="1630" height="64" fill="#ffffff"/><text x="18" y="170" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">User taps icon</text><line x1="330" y1="135" x2="330" y2="199" stroke="#c7d2df" stroke-width="1"/><text x="348" y="170" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">SpringBoard requests launch.</text><line x1="980" y1="135" x2="980" y2="199" stroke="#c7d2df" stroke-width="1"/><text x="998" y="170" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">SpringBoard requests foreground activation.</text><line x1="0" y1="199" x2="1630" y2="199" stroke="#c7d2df" stroke-width="1"/><rect x="0" y="199" width="1630" height="64" fill="#eaf0f7"/><text x="18" y="234" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">Process creation</text><line x1="330" y1="199" x2="330" y2="263" stroke="#c7d2df" stroke-width="1"/><text x="348" y="234" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">RUNS: XNU creates process and address space.</text><line x1="980" y1="199" x2="980" y2="263" stroke="#c7d2df" stroke-width="1"/><text x="998" y="234" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">SKIPPED: existing process resumes.</text><line x1="0" y1="263" x2="1630" y2="263" stroke="#c7d2df" stroke-width="1"/><rect x="0" y="263" width="1630" height="82" fill="#ffffff"/><text x="18" y="298" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">Executable/library loading</text><line x1="330" y1="263" x2="330" y2="345" stroke="#c7d2df" stroke-width="1"/><text x="348" y="298" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">RUNS: dyld maps executable/dependencies and resolves symbols.</text><line x1="980" y1="263" x2="980" y2="345" stroke="#c7d2df" stroke-width="1"/><text x="998" y="298" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">MOSTLY SKIPPED: mappings remain; reclaimed pages may fault back</text><text x="998" y="321" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">in.</text><line x1="0" y1="345" x2="1630" y2="345" stroke="#c7d2df" stroke-width="1"/><rect x="0" y="345" width="1630" height="64" fill="#eaf0f7"/><text x="18" y="380" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">Runtime initialization</text><line x1="330" y1="345" x2="330" y2="409" stroke="#c7d2df" stroke-width="1"/><text x="348" y="380" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">RUNS: Objective-C runtime and image initializers execute.</text><line x1="980" y1="345" x2="980" y2="409" stroke="#c7d2df" stroke-width="1"/><text x="998" y="380" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">SKIPPED: runtime state and objects remain in process.</text><line x1="0" y1="409" x2="1630" y2="409" stroke="#c7d2df" stroke-width="1"/><rect x="0" y="409" width="1630" height="82" fill="#ffffff"/><text x="18" y="444" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">Framework/app initialization</text><line x1="330" y1="409" x2="330" y2="491" stroke="#c7d2df" stroke-width="1"/><text x="348" y="444" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">RUNS: UIKit app and scene launch setup.</text><line x1="980" y1="409" x2="980" y2="491" stroke="#c7d2df" stroke-width="1"/><text x="998" y="444" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">ACTIVATION CALLBACKS RUN: app resumes; full initial launch is not</text><text x="998" y="467" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">repeated.</text><line x1="0" y1="491" x2="1630" y2="491" stroke="#c7d2df" stroke-width="1"/><rect x="0" y="491" width="1630" height="64" fill="#eaf0f7"/><text x="18" y="526" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">View/render</text><line x1="330" y1="491" x2="330" y2="555" stroke="#c7d2df" stroke-width="1"/><text x="348" y="526" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">First view is built/restored and frame rendered.</text><line x1="980" y1="491" x2="980" y2="555" stroke="#c7d2df" stroke-width="1"/><text x="998" y="526" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Existing UI is restored/updated and a frame rendered.</text><line x1="0" y1="555" x2="1630" y2="555" stroke="#c7d2df" stroke-width="1"/><text x="28" y="569" font-family="Arial, sans-serif" font-size="12" fill="#62748a">Assignment 4 • Q3.4 — Cold Start vs Warm Start</text></svg>