<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="589" viewBox="0 0 1600 589">
  <rect width="100%" height="100%" fill="#f4f7fb"/>
  <text x="28" y="48" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#14243a">Q3.1 — Execution Model Comparison</text><rect x="0" y="76" width="1600" height="59" fill="#17365d"/><text x="18" y="111" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Platform</text><text x="288" y="111" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Code delivered</text><line x1="270" y1="76" x2="270" y2="135" stroke="#7890ad" stroke-width="1"/><text x="718" y="111" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Loader / execution component</text><line x1="700" y1="76" x2="700" y2="135" stroke="#7890ad" stroke-width="1"/><text x="1168" y="111" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">When machine instructions are produced</text><line x1="1150" y1="76" x2="1150" y2="135" stroke="#7890ad" stroke-width="1"/><rect x="0" y="135" width="1600" height="151" fill="#ffffff"/><text x="18" y="170" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">Android — Dalvik</text><text x="18" y="193" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">(historical)</text><line x1="270" y1="135" x2="270" y2="286" stroke="#c7d2df" stroke-width="1"/><text x="288" y="170" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">APK containing DEX bytecode, resources and</text><text x="288" y="193" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">optional native libraries.</text><line x1="700" y1="135" x2="700" y2="286" stroke="#c7d2df" stroke-width="1"/><text x="718" y="170" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Package manager installs it; Zygote forks the</text><text x="718" y="193" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">app process; Dalvik VM loads DEX</text><text x="718" y="216" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">classes/methods.</text><line x1="1150" y1="135" x2="1150" y2="286" stroke="#c7d2df" stroke-width="1"/><text x="1168" y="170" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Dalvik interprets DEX and JIT-compiles</text><text x="1168" y="193" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">frequently used methods at run time. Native</text><text x="1168" y="216" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">instructions are generated as execution</text><text x="1168" y="239" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">proceeds, not as a complete native app at</text><text x="1168" y="262" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">install time.</text><line x1="0" y1="286" x2="1600" y2="286" stroke="#c7d2df" stroke-width="1"/><rect x="0" y="286" width="1600" height="128" fill="#eaf0f7"/><text x="18" y="321" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">iOS — Objective-C runtime</text><line x1="270" y1="286" x2="270" y2="414" stroke="#c7d2df" stroke-width="1"/><text x="288" y="321" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Signed app bundle with native Mach-O</text><text x="288" y="344" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">executable, linked frameworks/dylibs and</text><text x="288" y="367" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Objective-C metadata.</text><line x1="700" y1="286" x2="700" y2="414" stroke="#c7d2df" stroke-width="1"/><text x="718" y="321" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">XNU creates the process; dyld maps the</text><text x="718" y="344" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">executable and dependencies; Objective-C</text><text x="718" y="367" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">runtime initializes class metadata and</text><text x="718" y="390" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">dynamic dispatch.</text><line x1="1150" y1="286" x2="1150" y2="414" stroke="#c7d2df" stroke-width="1"/><text x="1168" y="321" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Compiler produces native instructions before</text><text x="1168" y="344" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">delivery (build time). CPU executes them</text><text x="1168" y="367" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">after loading; the Objective-C runtime does</text><text x="1168" y="390" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">not translate bytecode.</text><line x1="0" y1="414" x2="1600" y2="414" stroke="#c7d2df" stroke-width="1"/><rect x="0" y="414" width="1600" height="151" fill="#ffffff"/><text x="18" y="449" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">Windows — WinRT app model</text><line x1="270" y1="414" x2="270" y2="565" stroke="#c7d2df" stroke-width="1"/><text x="288" y="449" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Depends on language: C++/WinRT package</text><text x="288" y="472" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">contains native binaries; C# packages</text><text x="288" y="495" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">contain managed IL/metadata and may use</text><text x="288" y="518" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">.NET Native/AOT or a .NET runtime/JIT path</text><text x="288" y="541" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">depending on deployment.</text><line x1="700" y1="414" x2="700" y2="565" stroke="#c7d2df" stroke-width="1"/><text x="718" y="449" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Windows package deployment registers the app;</text><text x="718" y="472" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Windows loader loads native images. Managed</text><text x="718" y="495" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">apps use the relevant .NET runtime/toolchain.</text><text x="718" y="518" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">WinRT metadata/projections expose APIs to the</text><text x="718" y="541" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">language.</text><line x1="1150" y1="414" x2="1150" y2="565" stroke="#c7d2df" stroke-width="1"/><text x="1168" y="449" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">C++ native code is machine code at build</text><text x="1168" y="472" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">time. Managed IL is AOT-compiled before</text><text x="1168" y="495" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">execution in .NET Native deployments, or</text><text x="1168" y="518" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">JIT-compiled at run time where that model is</text><text x="1168" y="541" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">used.</text><line x1="0" y1="565" x2="1600" y2="565" stroke="#c7d2df" stroke-width="1"/><text x="28" y="579" font-family="Arial, sans-serif" font-size="12" fill="#62748a">Assignment 4 • Q3.1 — Execution Model Comparison</text></svg>