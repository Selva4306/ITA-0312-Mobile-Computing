<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="474" viewBox="0 0 1600 474">
  <rect width="100%" height="100%" fill="#f4f7fb"/>
  <text x="28" y="48" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#14243a">Q3.3 — Runtime Strategy Comparison</text><rect x="0" y="76" width="1600" height="59" fill="#17365d"/><text x="18" y="111" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Platform</text><text x="318" y="111" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Strategy</text><line x1="300" y1="76" x2="300" y2="135" stroke="#7890ad" stroke-width="1"/><text x="968" y="111" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Effect</text><line x1="950" y1="76" x2="950" y2="135" stroke="#7890ad" stroke-width="1"/><rect x="0" y="135" width="1600" height="105" fill="#ffffff"/><text x="18" y="170" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">Dalvik (legacy Android)</text><line x1="300" y1="135" x2="300" y2="240" stroke="#c7d2df" stroke-width="1"/><text x="318" y="170" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Interprets DEX and uses trace-based JIT for frequently executed</text><text x="318" y="193" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">code.</text><line x1="950" y1="135" x2="950" y2="240" stroke="#c7d2df" stroke-width="1"/><text x="968" y="170" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Portable DEX and less install-time compilation, but JIT warm-up</text><text x="968" y="193" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">consumes CPU and code-cache memory, affecting first-run latency</text><text x="968" y="216" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">and energy.</text><line x1="0" y1="240" x2="1600" y2="240" stroke="#c7d2df" stroke-width="1"/><rect x="0" y="240" width="1600" height="105" fill="#eaf0f7"/><text x="18" y="275" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">Objective-C runtime (iOS)</text><line x1="300" y1="240" x2="300" y2="345" stroke="#c7d2df" stroke-width="1"/><text x="318" y="275" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">No managed bytecode interpretation/JIT for normal app code.</text><text x="318" y="298" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Clang/LLVM compiles source to native ARM64 before distribution;</text><text x="318" y="321" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">runtime supplies dynamic dispatch.</text><line x1="950" y1="240" x2="950" y2="345" stroke="#c7d2df" stroke-width="1"/><text x="968" y="275" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">No VM/JIT warm-up; native execution is efficient. dyld linking,</text><text x="968" y="298" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">framework loading and runtime initialization still take time and</text><text x="968" y="321" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">memory.</text><line x1="0" y1="345" x2="1600" y2="345" stroke="#c7d2df" stroke-width="1"/><rect x="0" y="345" width="1600" height="105" fill="#ffffff"/><text x="18" y="380" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">Windows / WinRT</text><line x1="300" y1="345" x2="300" y2="450" stroke="#c7d2df" stroke-width="1"/><text x="318" y="380" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">WinRT APIs are not a compilation strategy. C++/WinRT is native. C#</text><text x="318" y="403" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">may use .NET Native/AOT in UWP deployments or a managed .NET</text><text x="318" y="426" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">runtime/JIT in other app configurations.</text><line x1="950" y1="345" x2="950" y2="450" stroke="#c7d2df" stroke-width="1"/><text x="968" y="380" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Native/AOT avoids launch-time JIT; managed IL offers runtime</text><text x="968" y="403" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">services and portability but may need JIT and runtime memory.</text><text x="968" y="426" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Depends on language/package model.</text><line x1="0" y1="450" x2="1600" y2="450" stroke="#c7d2df" stroke-width="1"/><text x="28" y="464" font-family="Arial, sans-serif" font-size="12" fill="#62748a">Assignment 4 • Q3.3 — Runtime Strategy Comparison</text></svg>