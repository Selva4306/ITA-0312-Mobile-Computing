<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="897" viewBox="0 0 1600 897">
  <rect width="100%" height="100%" fill="#f4f7fb"/>
  <text x="28" y="48" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#14243a">Q3.2 — iOS Application Launch Sequence</text><rect x="0" y="76" width="1600" height="59" fill="#17365d"/><text x="18" y="111" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Step</text><text x="268" y="111" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Action and purpose</text><line x1="250" y1="76" x2="250" y2="135" stroke="#7890ad" stroke-width="1"/><text x="838" y="111" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Component</text><line x1="820" y1="76" x2="820" y2="135" stroke="#7890ad" stroke-width="1"/><text x="1198" y="111" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Prerequisite</text><line x1="1180" y1="76" x2="1180" y2="135" stroke="#7890ad" stroke-width="1"/><rect x="0" y="135" width="1600" height="82" fill="#ffffff"/><text x="18" y="170" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">1. Launch request</text><line x1="250" y1="135" x2="250" y2="217" stroke="#c7d2df" stroke-width="1"/><text x="268" y="170" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">User taps icon; system identifies the app and requests</text><text x="268" y="193" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">launch.</text><line x1="820" y1="135" x2="820" y2="217" stroke="#c7d2df" stroke-width="1"/><text x="838" y="170" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">SpringBoard / launch services</text><line x1="1180" y1="135" x2="1180" y2="217" stroke="#c7d2df" stroke-width="1"/><text x="1198" y="170" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Installed, registered, signed app.</text><line x1="0" y1="217" x2="1600" y2="217" stroke="#c7d2df" stroke-width="1"/><rect x="0" y="217" width="1600" height="82" fill="#eaf0f7"/><text x="18" y="252" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">2. Process creation</text><line x1="250" y1="217" x2="250" y2="299" stroke="#c7d2df" stroke-width="1"/><text x="268" y="252" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Creates a process with its own address space, credentials</text><text x="268" y="275" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">and sandbox to isolate the app.</text><line x1="820" y1="217" x2="820" y2="299" stroke="#c7d2df" stroke-width="1"/><text x="838" y="252" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">XNU kernel/process services</text><line x1="1180" y1="217" x2="1180" y2="299" stroke="#c7d2df" stroke-width="1"/><text x="1198" y="252" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Kernel, memory manager, code-signing</text><text x="1198" y="275" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">policy and executable.</text><line x1="0" y1="299" x2="1600" y2="299" stroke="#c7d2df" stroke-width="1"/><rect x="0" y="299" width="1600" height="82" fill="#ffffff"/><text x="18" y="334" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">3. Image loading</text><line x1="250" y1="299" x2="250" y2="381" stroke="#c7d2df" stroke-width="1"/><text x="268" y="334" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Maps Mach-O executable and dependent libraries; resolves</text><text x="268" y="357" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">symbols and dependencies.</text><line x1="820" y1="299" x2="820" y2="381" stroke="#c7d2df" stroke-width="1"/><text x="838" y="334" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">dyld with kernel VM support</text><line x1="1180" y1="299" x2="1180" y2="381" stroke="#c7d2df" stroke-width="1"/><text x="1198" y="334" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Valid executable/signature and compatible</text><text x="1198" y="357" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">libraries.</text><line x1="0" y1="381" x2="1600" y2="381" stroke="#c7d2df" stroke-width="1"/><rect x="0" y="381" width="1600" height="82" fill="#eaf0f7"/><text x="18" y="416" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">4. Runtime setup</text><line x1="250" y1="381" x2="250" y2="463" stroke="#c7d2df" stroke-width="1"/><text x="268" y="416" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Registers Objective-C class metadata and prepares</text><text x="268" y="439" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">class/selector structures for dynamic dispatch.</text><line x1="820" y1="381" x2="820" y2="463" stroke="#c7d2df" stroke-width="1"/><text x="838" y="416" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Objective-C runtime</text><line x1="1180" y1="381" x2="1180" y2="463" stroke="#c7d2df" stroke-width="1"/><text x="1198" y="416" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Executable and metadata mapped into</text><text x="1198" y="439" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">process.</text><line x1="0" y1="463" x2="1600" y2="463" stroke="#c7d2df" stroke-width="1"/><rect x="0" y="463" width="1600" height="82" fill="#ffffff"/><text x="18" y="498" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">5. Initializers</text><line x1="250" y1="463" x2="250" y2="545" stroke="#c7d2df" stroke-width="1"/><text x="268" y="498" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Runs required C/C++ and language/runtime initializers</text><text x="268" y="521" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">before normal app entry.</text><line x1="820" y1="463" x2="820" y2="545" stroke="#c7d2df" stroke-width="1"/><text x="838" y="498" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">dyld and runtime initialization</text><text x="838" y="521" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">code</text><line x1="1180" y1="463" x2="1180" y2="545" stroke="#c7d2df" stroke-width="1"/><text x="1198" y="498" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Loaded images and initialized runtime</text><text x="1198" y="521" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">structures.</text><line x1="0" y1="545" x2="1600" y2="545" stroke="#c7d2df" stroke-width="1"/><rect x="0" y="545" width="1600" height="82" fill="#eaf0f7"/><text x="18" y="580" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">6. Framework entry</text><line x1="250" y1="545" x2="250" y2="627" stroke="#c7d2df" stroke-width="1"/><text x="268" y="580" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Starts application event environment and creates the</text><text x="268" y="603" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">application object.</text><line x1="820" y1="545" x2="820" y2="627" stroke="#c7d2df" stroke-width="1"/><text x="838" y="580" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">UIKit / UIApplicationMain or</text><text x="838" y="603" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">SwiftUI lifecycle</text><line x1="1180" y1="545" x2="1180" y2="627" stroke="#c7d2df" stroke-width="1"/><text x="1198" y="580" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Runtime and UIKit available.</text><line x1="0" y1="627" x2="1600" y2="627" stroke="#c7d2df" stroke-width="1"/><rect x="0" y="627" width="1600" height="82" fill="#ffffff"/><text x="18" y="662" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">7. App/scene setup</text><line x1="250" y1="627" x2="250" y2="709" stroke="#c7d2df" stroke-width="1"/><text x="268" y="662" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Delivers launch callbacks and creates window/root view</text><text x="268" y="685" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">controller, connecting app logic to UI lifecycle.</text><line x1="820" y1="627" x2="820" y2="709" stroke="#c7d2df" stroke-width="1"/><text x="838" y="662" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">UIKit and app/scene delegates</text><line x1="1180" y1="627" x2="1180" y2="709" stroke="#c7d2df" stroke-width="1"/><text x="1198" y="662" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Application object and configuration.</text><line x1="0" y1="709" x2="1600" y2="709" stroke="#c7d2df" stroke-width="1"/><rect x="0" y="709" width="1600" height="82" fill="#eaf0f7"/><text x="18" y="744" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">8. First view</text><line x1="250" y1="709" x2="250" y2="791" stroke="#c7d2df" stroke-width="1"/><text x="268" y="744" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Builds view hierarchy, calculates layout and prepares</text><text x="268" y="767" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">drawing/layer commands.</text><line x1="820" y1="709" x2="820" y2="791" stroke="#c7d2df" stroke-width="1"/><text x="838" y="744" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">App code, UIKit, Core Animation</text><line x1="1180" y1="709" x2="1180" y2="791" stroke="#c7d2df" stroke-width="1"/><text x="1198" y="744" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Window, root controller/view and required</text><text x="1198" y="767" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">resources.</text><line x1="0" y1="791" x2="1600" y2="791" stroke="#c7d2df" stroke-width="1"/><rect x="0" y="791" width="1600" height="82" fill="#ffffff"/><text x="18" y="826" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">9. First frame</text><line x1="250" y1="791" x2="250" y2="873" stroke="#c7d2df" stroke-width="1"/><text x="268" y="826" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Commits layer tree; render services/GPU compose and</text><text x="268" y="849" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">display first frame.</text><line x1="820" y1="791" x2="820" y2="873" stroke="#c7d2df" stroke-width="1"/><text x="838" y="826" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Core Animation, render server and</text><text x="838" y="849" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">graphics hardware</text><line x1="1180" y1="791" x2="1180" y2="873" stroke="#c7d2df" stroke-width="1"/><text x="1198" y="826" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Valid layer tree and display pipeline.</text><line x1="0" y1="873" x2="1600" y2="873" stroke="#c7d2df" stroke-width="1"/><text x="28" y="887" font-family="Arial, sans-serif" font-size="12" fill="#62748a">Assignment 4 • Q3.2 — iOS Application Launch Sequence</text></svg>