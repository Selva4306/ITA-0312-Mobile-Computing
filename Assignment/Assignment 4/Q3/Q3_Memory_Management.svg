<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="451" viewBox="0 0 1600 451">
  <rect width="100%" height="100%" fill="#f4f7fb"/>
  <text x="28" y="48" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#14243a">Q3.3 — Memory Management Comparison</text><rect x="0" y="76" width="1600" height="59" fill="#17365d"/><text x="18" y="111" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Platform</text><text x="318" y="111" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Approach</text><line x1="300" y1="76" x2="300" y2="135" stroke="#7890ad" stroke-width="1"/><text x="968" y="111" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Responsiveness and battery effect</text><line x1="950" y1="76" x2="950" y2="135" stroke="#7890ad" stroke-width="1"/><rect x="0" y="135" width="1600" height="82" fill="#ffffff"/><text x="18" y="170" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">Dalvik</text><line x1="300" y1="135" x2="300" y2="217" stroke="#c7d2df" stroke-width="1"/><text x="318" y="170" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Automatic tracing garbage collection reclaims unreachable objects.</text><line x1="950" y1="135" x2="950" y2="217" stroke="#c7d2df" stroke-width="1"/><text x="968" y="170" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Avoids manual freeing, but GC consumes CPU and may pause work.</text><text x="968" y="193" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">High allocation rates increase collection and energy pressure.</text><line x1="0" y1="217" x2="1600" y2="217" stroke="#c7d2df" stroke-width="1"/><rect x="0" y="217" width="1600" height="105" fill="#eaf0f7"/><text x="18" y="252" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">Objective-C</text><line x1="300" y1="217" x2="300" y2="322" stroke="#c7d2df" stroke-width="1"/><text x="318" y="252" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">ARC inserts retain/release operations at compile time; objects are</text><text x="318" y="275" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">freed when strong reference counts reach zero. Weak references and</text><text x="318" y="298" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">autorelease pools are supported.</text><line x1="950" y1="217" x2="950" y2="322" stroke="#c7d2df" stroke-width="1"/><text x="968" y="252" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Predictable reclamation without a general tracing-GC pause.</text><text x="968" y="275" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Retain/release operations cost CPU; strong-reference cycles can</text><text x="968" y="298" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">leak.</text><line x1="0" y1="322" x2="1600" y2="322" stroke="#c7d2df" stroke-width="1"/><rect x="0" y="322" width="1600" height="105" fill="#ffffff"/><text x="18" y="357" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2c3d">Windows</text><line x1="300" y1="322" x2="300" y2="427" stroke="#c7d2df" stroke-width="1"/><text x="318" y="357" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Depends on language: .NET uses tracing GC; native C++ uses</text><text x="318" y="380" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">ownership/RAII/smart pointers; many WinRT component interfaces use</text><text x="318" y="403" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">reference counting.</text><line x1="950" y1="322" x2="950" y2="427" stroke="#c7d2df" stroke-width="1"/><text x="968" y="357" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">GC simplifies memory management but can pause and consume CPU.</text><text x="968" y="380" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">Native ownership can be predictable/lightweight but requires</text><text x="968" y="403" font-family="Arial, sans-serif" font-size="17"  fill="#1d2c3d">discipline. WinRT reference counting is not a universal GC.</text><line x1="0" y1="427" x2="1600" y2="427" stroke="#c7d2df" stroke-width="1"/><text x="28" y="441" font-family="Arial, sans-serif" font-size="12" fill="#62748a">Assignment 4 • Q3.3 — Memory Management Comparison</text></svg>